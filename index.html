<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Jotihunt Tracker</title>
    <meta name="description" content="Volg de Jotihunt in real-time met de Jotihunt Tracker!" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/logo-mono.svg" color="#ea580c" />
    <link rel="assetlinks.json file" href="/.well-known/assetlinks.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1e" />
    <meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
  </head>
  <body>
    <script>
      // Dark users would see a white page until React mounts: apply the persisted theme (settings-storage, zustand's
      // {"state":{"darkMode":true|false|undefined}}) or else the OS one now, same as useTheme (.dark on body, theme-color
      // metas, color-scheme on html); keep in sync with src/hooks/theme.hook.ts and src/lib/theme-color.ts
      (function () {
        var dark;
        try {
          var stored = JSON.parse(localStorage.getItem('settings-storage') || 'null');
          dark = stored && stored.state ? stored.state.darkMode : undefined;
        } catch (e) {}
        if (typeof dark !== 'boolean') dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.body.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', dark ? '#1a1a1e' : '#ffffff');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
